<div class="container mx-auto p-4 md:w-1/2">
  <h2 class="text-2xl font-bold mb-4">{{ isEditMode ? 'Edit' : 'Insert' }} Course</h2>

  <form (ngSubmit)="saveCourse()" #courseForm="ngForm" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Title</label>
      <input
        type="text"
        name="title"
        [(ngModel)]="course.title"
        required
        class="w-full border p-2 rounded"
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Instructor</label>
      <input
        type="text"
        name="instructor"
        [(ngModel)]="course.instructor"
        required
        class="w-full border p-2 rounded"
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Price</label>
      <input
        type="number"
        name="price"
        [(ngModel)]="course.price"
        required
        class="w-full border p-2 rounded"
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Seats</label>
      <input
        type="number"
        name="seats"
        [(ngModel)]="course.seats"
        required
        class="w-full border p-2 rounded"
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Image URL</label>
      <input
        type="text"
        name="image"
        [(ngModel)]="course.image"
        class="w-full border p-2 rounded"
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Category</label>
      <select name="catId" [(ngModel)]="course.catId" required class="w-full border p-2 rounded">
      <option [ngValue]="0" disabled>Select tracking category</option>
      @for (cat of categories; track cat.id) {
        <option [ngValue]="cat.id">{{ cat.name }}</option>
      }
      </select>
    </div>

    <button
      type="submit"
      [disabled]="courseForm.invalid"
      class="bg-blue-600 text-white px-4 py-2 rounded mt-4"
    >
      {{ isEditMode ? 'Update' : 'Insert' }} Course
    </button>
  </form>
</div>
