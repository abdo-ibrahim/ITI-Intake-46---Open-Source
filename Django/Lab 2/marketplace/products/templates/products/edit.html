{% extends 'base.html' %} {% block title %}Edit {{ product.name }} | MarketPlace{% endblock %} {% block content %}
<div class="container fade-in">
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
    <h1 class="h3 mb-0">Edit Product</h1>
    <a href="{% url 'products:show' product.id %}" class="btn-ghost">Back</a>
  </div>

  <div class="info-card p-4">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="name">Name</label>
          <input class="form-control" id="name" name="name" type="text" value="{{ product.name }}" required />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="category">Category</label>
          <select class="form-control" id="category" name="category">
            <option value="">Select category</option>
            {% for category in categories %}
            <!-- prettier-ignore -->
            <option value="{{ category.id }}" {% if product.category and product.category.id == category.id %}selected{% endif %}>
  {{ category.name }}
</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="price">Price</label>
          <input class="form-control" id="price" name="price" type="number" min="0" step="0.01" value="{{ product.price }}" required />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="stock">Stock</label>
          <input class="form-control" id="stock" name="stock" type="number" min="0" value="{{ product.stock }}" required />
        </div>
        <div class="col-12">
          <label class="form-label" for="description">Description</label>
          <textarea class="form-control" id="description" name="description" rows="4">{{ product.description }}</textarea>
        </div>
        <div class="col-12">
          <label class="form-label" for="image">Replace Image</label>
          <input class="form-control" id="image" name="image" type="file" accept="image/*" />
        </div>
      </div>

      <div class="mt-4 d-flex gap-2 flex-wrap">
        <button type="submit" class="btn btn-show">Save Changes</button>
        <a href="{% url 'products:show' product.id %}" class="btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
