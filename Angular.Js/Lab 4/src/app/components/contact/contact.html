<div class="max-w-2xl mx-auto py-16 px-4">
  <div class="text-center mb-10">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-4">Contact Us</h1>
    <p class="text-lg text-gray-500">Have questions? We'd love to hear from you.</p>
  </div>

  <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <form class="space-y-6">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
        <div class="mt-1">
          <input
            type="text"
            id="name"
            name="name"
            class="py-3 px-4 block w-full shadow-sm focus:ring-purple-500 focus:border-purple-500 border-gray-300 rounded-md bg-gray-50 border transition-all"
            placeholder="John Doe"
          />
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
        <div class="mt-1">
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            class="py-3 px-4 block w-full shadow-sm focus:ring-purple-500 focus:border-purple-500 border-gray-300 rounded-md bg-gray-50 border transition-all"
            placeholder="you@example.com"
          />
        </div>
      </div>

      <div>
        <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
        <div class="mt-1">
          <textarea
            id="message"
            name="message"
            rows="4"
            class="py-3 px-4 block w-full shadow-sm focus:ring-purple-500 focus:border-purple-500 border-gray-300 rounded-md bg-gray-50 border transition-all"
            placeholder="How can we help?"
          ></textarea>
        </div>
      </div>

      <div>
        <button
          type="button"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition-colors"
        >
          Send Message
        </button>
      </div>
    </form>
  </div>
</div>
