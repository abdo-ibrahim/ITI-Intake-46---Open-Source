<div class="container mx-auto p-4">
  <div class="flex items-center gap-4 my-4 justify-center">
    <label for="category" class="mb-2 font-semibold">Select a Category:</label>
    <select id="category" [(ngModel)]="selectedCategory" class="border p-1 rounded">
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
  </div>

  <div class="flex flex-wrap gap-8 justify-center">
    @for (course of filteredCourses; track course.id) {
      <div
        class="rounded-md shadow-md w-64 flex flex-col items-center transition-shadow hover:shadow-lg p-4"
        [ngClass]="{
          'text-red-500': course.seats === 0,
          'bg-red-50': course.seats <= 2,
          'bg-red-200': course.seats === 0,
        }"
      >
        <img
          [src]="course.image"
          [alt]="course.title"
          class="w-48 h-32 object-cover rounded-md mb-4"
        />
        <div class="text-center">
          <h3 class="text-xl font-bold mb-2">{{ course.title }}</h3>
          <p class="text-gray-700 mb-1">{{ course.instructor }}</p>
          <p class="text-green-700 font-medium mb-1">Price: ${{ course.price }}</p>
          @if (course.seats === 0) {
            <p class="font-bold mb-2">Course Full</p>
          } @else if (course.seats <= 2) {
            <p class="font-bold mb-2">Almost Full</p>
          } @else if (course.seats > 0) {
            <p class="text-blue-700 font-medium mb-2">Seats Available: {{ course.seats }}</p>
          }
        </div>
        <button
          class="my-2 px-4 py-2 bg-purple-500 text-white rounded-full shadow hover:bg-purple-400 transition-colors cursor-pointer"
          (click)="register(course)"
          [disabled]="course.seats === 0"
        >
          Register
        </button>
      </div>
    }
  </div>
</div>
