{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}My Marketplace{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg nav-shell sticky-top">
      <div class="container">
        <a class="navbar-brand brand-mark" href="{% url 'products:index' %}">MarketPlace</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto gap-2">
            <li class="nav-item">
              <a class="nav-link nav-pill {% if request.path == '/' or request.path|slice:':10' == '/products/' %}active{% endif %}" href="{% url 'products:index' %}">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-pill {% if request.path|slice:':12' == '/categories/' %}active{% endif %}" href="{% url 'categories:index' %}">Categories</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-pill {% if request.path|slice:':9' == '/about-us' %}active{% endif %}" href="{% url 'aboutus:index' %}">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-pill {% if request.path|slice:':11' == '/contact-us' %}active{% endif %}" href="{% url 'contactus:index' %}">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="main-shell">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center py-3">
        <p class="mb-2 mb-md-0">Curated products. Simple checkout. Better shopping.</p>
        <small>MarketPlace Demo | 2026</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
